name: 🍎 macOS VNC Debug

on:
  workflow_dispatch:

jobs:
  macos-vnc:
    runs-on: macos-latest
    timeout-minutes: 350

    env:
      VNC_USERNAME: ATOMA
      VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}

    steps:
      - name: 👤 Create User
        run: |
          sudo sysadminctl -addUser "$VNC_USERNAME" -password "$VNC_PASSWORD" -admin
          sudo dscl . -create /Users/"$VNC_USERNAME" UserShell /bin/bash

      - name: 🖥️ Enable Screen Sharing
        run: |
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on -restart -agent -privs -all -allowAccessFor -allUsers

          echo "$VNC_PASSWORD" | sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on -restart -agent -privs -all \
            -clientopts -setvnclegacy -vnclegacy yes -setvncpw -vncpw "$VNC_PASSWORD"

          sudo /usr/libexec/PlistBuddy -c "Add :VNCLegacyPasswords array" /Library/Preferences/com.apple.RemoteManagement.plist 2>/dev/null || true
          sudo /usr/libexec/PlistBuddy -c "Delete :VNCLegacyPasswords:0" /Library/Preferences/com.apple.RemoteManagement.plist 2>/dev/null || true
          HASH=$(python3 - <<PY
          import hashlib
          print(hashlib.md5(b"$VNC_PASSWORD").hexdigest())
          PY
          )
          sudo /usr/libexec/PlistBuddy -c "Add :VNCLegacyPasswords:0 data $(echo $HASH | xxd -r -p | base64)" /Library/Preferences/com.apple.RemoteManagement.plist

          sudo launchctl unload /System/Library/LaunchDaemons/com.apple.screensharing.plist 2>/dev/null || true
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist

      - name: 🔥 Disable Firewall
        run: sudo /usr/libexec/ApplicationFirewall/socketfilterfw --setglobalstate off

      - name: 🌐 Install Tailscale
        run: |
          brew install tailscale
          sudo brew services start tailscale
          sleep 5

      - name: 🔗 Connect to Tailscale
        run: |
          sudo tailscale up --authkey="${{ secrets.TAILSCALE_AUTHKEY }}" --hostname="gh-runner-${{ github.run_id }}"
          sleep 10
          TS_IP=$(sudo tailscale ip -4)
          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV

      - name: 📊 Diagnostics
        run: |
          echo "=== VNC Listening ==="
          sudo lsof -i :5900
          echo "=== VNC Password (base64) ==="
          sudo /usr/libexec/PlistBuddy -c "Print :VNCLegacyPasswords:0" /Library/Preferences/com.apple.RemoteManagement.plist 2>/dev/null || echo "No password plist entry"
          echo "=== Local Connectivity Test ==="
          nc -zv localhost 5900 && echo "✅ local port open" || echo "❌ local port closed"
          echo "=== Tailscale IP ==="
          echo "$TAILSCALE_IP"

      - name: 📋 Connection Info
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🟢 macOS VNC READY"
          echo "👤 Username: $VNC_USERNAME"
          echo "🌐 Tailscale IP: $TAILSCALE_IP"
          echo "🔐 Password: (stored in secret VNC_PASSWORD)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "👉 Next steps:"
          echo "1. On your local machine, run: tailscale status"
          echo "2. Ping $TAILSCALE_IP"
          echo "3. SSH: ssh $VNC_USERNAME@$TAILSCALE_IP"
          echo "4. VNC: connect to $TAILSCALE_IP:5900 with your VNC client"
          echo "5. If VNC fails, try SSH tunnel: ssh -L 5900:localhost:5900 $VNC_USERNAME@$TAILSCALE_IP"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: ⏳ Keep Alive
        run: while true; do echo "[$(date +%H:%M:%S)] 🟢 Alive"; sleep 300; done

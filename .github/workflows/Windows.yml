name: 🪟 Windows 2025 Server TEMP RDP

on:
  workflow_dispatch:
    inputs:
      session_minutes:
        description: "How long to keep the session alive (minutes)"
        required: false
        default: "360"

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      RDP_USERNAME: ATOMA
      RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
      TAILSCALE_VERSION: "1.102.4"

    steps:

      # ============================================================
      # ENABLE RDP
      # ============================================================

      - name: 🖥️ Enable Remote Desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "🖥️ Enabling Remote Desktop Services..."

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' `
            -Value 1 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'SecurityLayer' `
            -Value 1 `
            -Force

          Write-Host "🔥 Configuring Windows Firewall..."

          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null | Out-Null

          netsh advfirewall firewall add rule `
            name="RDP-Tailscale" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389 | Out-Null

          Restart-Service -Name TermService -Force

          Write-Host "✅ RDP service restarted"
          Write-Host "✅ Firewall rule added"
          Write-Host "✅ Network Level Authentication enabled"

      # ============================================================
      # CREATE RDP USER
      # ============================================================

      - name: 👤 Create Administrator User
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "👤 Setting up user: $env:RDP_USERNAME"

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
              throw "❌ RDP_PASSWORD secret is empty or missing."
          }

          $securePass = ConvertTo-SecureString `
            $env:RDP_PASSWORD `
            -AsPlainText `
            -Force

          $existingUser = Get-LocalUser `
            -Name $env:RDP_USERNAME `
            -ErrorAction SilentlyContinue

          if (-not $existingUser) {

              New-LocalUser `
                -Name $env:RDP_USERNAME `
                -Password $securePass `
                -AccountNeverExpires `
                -PasswordNeverExpires `
                -Description "Temporary RDP administrator"

              Write-Host "✅ User created successfully"

          }
          else {

              Write-Host "ℹ️ User already exists"

              Set-LocalUser `
                -Name $env:RDP_USERNAME `
                -Password $securePass

              Write-Host "✅ Existing user password updated"
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $env:RDP_USERNAME `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $env:RDP_USERNAME `
            -ErrorAction SilentlyContinue

          Write-Host "✅ Administrator membership configured"
          Write-Host "✅ Remote Desktop Users membership configured"

          Get-LocalUser -Name $env:RDP_USERNAME |
            Select-Object Name, Enabled, Description

      # ============================================================
      # WINDOWS DARK MODE
      #
      # No NTUSER.DAT loading.
      # No HKU hive mounting.
      # No reg unload.
      #
      # A one-time task runs in ATOMA's user context at logon,
      # so HKCU is naturally ATOMA's profile.
      # ============================================================

      - name: 🌙 Configure Windows Dark Mode for ATOMA
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Import-Module ScheduledTasks -ErrorAction Stop

          $taskName = "ATOMA-Initialize-DarkMode"
          $scriptDir = "C:\ProgramData\ATOMA"
          $scriptPath = Join-Path $scriptDir "Set-DarkMode.ps1"

          Write-Host "🌙 Preparing Dark Mode for $env:RDP_USERNAME..."

          # ----------------------------------------------------------
          # Create directory
          # ----------------------------------------------------------

          New-Item `
            -Path $scriptDir `
            -ItemType Directory `
            -Force | Out-Null

          # ----------------------------------------------------------
          # Remove any previous copy of the task
          # ----------------------------------------------------------

          $oldTask = Get-ScheduledTask `
            -TaskName $taskName `
            -ErrorAction SilentlyContinue

          if ($oldTask) {
              Write-Host "🧹 Removing previous Dark Mode task..."

              Unregister-ScheduledTask `
                -TaskName $taskName `
                -Confirm:$false
          }

          # ----------------------------------------------------------
          # Script executed when ATOMA logs in
          # ----------------------------------------------------------

          $darkModeScript = @'
$ErrorActionPreference = "Stop"

Write-Host "🌙 Applying Windows Dark Mode..."
Write-Host "👤 Current user: $env:USERNAME"

$personalizeKey =
    "HKCU\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize"

# Create Personalize key
& reg.exe add "$personalizeKey" /f | Out-Null

if ($LASTEXITCODE -ne 0) {
    throw "Failed to create Personalize registry key."
}

# Dark application mode
& reg.exe add "$personalizeKey" `
    /v AppsUseLightTheme `
    /t REG_DWORD `
    /d 0 `
    /f | Out-Null

if ($LASTEXITCODE -ne 0) {
    throw "Failed to set AppsUseLightTheme."
}

# Dark Windows/system mode
& reg.exe add "$personalizeKey" `
    /v SystemUsesLightTheme `
    /t REG_DWORD `
    /d 0 `
    /f | Out-Null

if ($LASTEXITCODE -ne 0) {
    throw "Failed to set SystemUsesLightTheme."
}

# Transparency
& reg.exe add "$personalizeKey" `
    /v EnableTransparency `
    /t REG_DWORD `
    /d 1 `
    /f | Out-Null

# ----------------------------------------------------------
# Verify
# ----------------------------------------------------------

Write-Host "🔎 Verifying Dark Mode..."

$query = & reg.exe query "$personalizeKey" 2>&1

Write-Host ""
Write-Host $query
Write-Host ""

if ($query -notmatch 'AppsUseLightTheme\s+REG_DWORD\s+0x0') {
    throw "AppsUseLightTheme was not set to 0."
}

if ($query -notmatch 'SystemUsesLightTheme\s+REG_DWORD\s+0x0') {
    throw "SystemUsesLightTheme was not set to 0."
}

Write-Host "✅ AppsUseLightTheme = 0"
Write-Host "✅ SystemUsesLightTheme = 0"
Write-Host "✅ Dark Mode applied successfully"

# ----------------------------------------------------------
# Refresh Explorer in the user's session
# ----------------------------------------------------------

try {
    $explorerProcesses = Get-Process explorer -ErrorAction SilentlyContinue

    if ($explorerProcesses) {
        $explorerProcesses |
            Stop-Process -Force -ErrorAction SilentlyContinue

        Start-Sleep -Seconds 2
    }

    Start-Process explorer.exe
}
catch {
    Write-Host "ℹ️ Explorer refresh was skipped."
}

# ----------------------------------------------------------
# Remove one-time task
# ----------------------------------------------------------

try {
    Unregister-ScheduledTask `
        -TaskName "ATOMA-Initialize-DarkMode" `
        -Confirm:$false `
        -ErrorAction SilentlyContinue

    Write-Host "🧹 One-time Dark Mode task removed"
}
catch {
    Write-Host "ℹ️ Task cleanup could not be completed."
}

Write-Host "✅ ATOMA Dark Mode initialization complete"
'@

          Set-Content `
            -Path $scriptPath `
            -Value $darkModeScript `
            -Encoding UTF8 `
            -Force

          Write-Host "✅ Dark Mode script created:"
          Write-Host "   $scriptPath"

          # ----------------------------------------------------------
          # Find PowerShell 7
          # ----------------------------------------------------------

          $pwshCommand = Get-Command pwsh.exe -ErrorAction SilentlyContinue

          if (-not $pwshCommand) {
              throw "❌ PowerShell 7 (pwsh.exe) was not found."
          }

          $pwshPath = $pwshCommand.Source

          Write-Host "🔧 PowerShell:"
          Write-Host "   $pwshPath"

          # ----------------------------------------------------------
          # Scheduled task action
          # ----------------------------------------------------------

          $action = New-ScheduledTaskAction `
            -Execute $pwshPath `
            -Argument `
              "-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File `"$scriptPath`""

          # ----------------------------------------------------------
          # Trigger at ATOMA logon
          # ----------------------------------------------------------

          $trigger = New-ScheduledTaskTrigger `
            -AtLogOn `
            -User $env:RDP_USERNAME

          # ----------------------------------------------------------
          # ATOMA principal
          #
          # Interactive logon means the task runs in ATOMA's
          # interactive user session when ATOMA logs in.
          # ----------------------------------------------------------

          $principal = New-ScheduledTaskPrincipal `
            -UserId "$env:COMPUTERNAME\$env:RDP_USERNAME" `
            -LogonType Interactive `
            -RunLevel Highest

          # ----------------------------------------------------------
          # Task settings
          # ----------------------------------------------------------

          $settings = New-ScheduledTaskSettingsSet `
            -AllowStartIfOnBatteries `
            -DontStopIfGoingOnBatteries `
            -StartWhenAvailable

          # ----------------------------------------------------------
          # Register
          # ----------------------------------------------------------

          Write-Host "📅 Registering Dark Mode scheduled task..."

          Register-ScheduledTask `
            -TaskName $taskName `
            -Action $action `
            -Trigger $trigger `
            -Principal $principal `
            -Settings $settings `
            -Description "Applies Windows Dark Mode to ATOMA at logon." `
            -Force | Out-Null

          Write-Host "✅ Dark Mode task registered"

          # ----------------------------------------------------------
          # Verify registration
          # ----------------------------------------------------------

          $task = Get-ScheduledTask `
            -TaskName $taskName `
            -ErrorAction Stop

          Write-Host ""
          Write-Host "──── Dark Mode Task Verification ────"
          Write-Host "Task Name : $($task.TaskName)"
          Write-Host "State     : $($task.State)"
          Write-Host "User      : $($task.Principal.UserId)"
          Write-Host "LogonType : $($task.Principal.LogonType)"
          Write-Host "RunLevel  : $($task.Principal.RunLevel)"
          Write-Host "Trigger   : AtLogOn"
          Write-Host "Script    : $scriptPath"
          Write-Host "────────────────────────────────────"
          Write-Host ""

          Write-Host "✅ Dark Mode task is ready."
          Write-Host "ℹ️ Dark Mode is applied when ATOMA starts its Windows session."

      # ============================================================
      # TAILSCALE INSTALL
      # ============================================================

      - name: 🌐 Install Tailscale v${{ env.TAILSCALE_VERSION }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "🌐 Installing Tailscale v$env:TAILSCALE_VERSION..."

          $tsUrl =
            "https://pkgs.tailscale.com/stable/" +
            "tailscale-setup-$env:TAILSCALE_VERSION-amd64.msi"

          $installerPath =
            "$env:TEMP\tailscale-$env:TAILSCALE_VERSION.msi"

          Write-Host "⬇️ Download URL:"
          Write-Host $tsUrl

          Invoke-WebRequest `
            -Uri $tsUrl `
            -OutFile $installerPath `
            -UseBasicParsing

          if (-not (Test-Path $installerPath)) {
              throw "❌ Tailscale installer download failed."
          }

          Write-Host "📦 Installing Tailscale..."

          $process = Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList @(
              "/i",
              "`"$installerPath`"",
              "/quiet",
              "/norestart"
            ) `
            -Wait `
            -PassThru

          if ($process.ExitCode -ne 0) {
              throw "❌ Tailscale installation failed with exit code $($process.ExitCode)."
          }

          Remove-Item `
            $installerPath `
            -Force `
            -ErrorAction SilentlyContinue

          $tailscaleExe =
            "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscaleExe)) {
              throw "❌ tailscale.exe was not found after installation."
          }

          Write-Host "✅ Tailscale installed"

          Write-Host "🔎 Installed version:"
          & $tailscaleExe version

      # ============================================================
      # TAILSCALE CONNECTION
      # ============================================================

      - name: 🔗 Connect to Tailscale Mesh
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "🔗 Authenticating & joining Tailscale network..."

          $authKey = "${{ secrets.TAILSCALE_AUTHKEY }}"

          if ([string]::IsNullOrWhiteSpace($authKey)) {
              throw "❌ TAILSCALE_AUTHKEY secret is missing."
          }

          $tailscaleExe =
            "$env:ProgramFiles\Tailscale\tailscale.exe"

          $hostname =
            "gh-runner-$env:GITHUB_RUN_ID"

          & $tailscaleExe up `
            --authkey="$authKey" `
            --hostname="$hostname"

          if ($LASTEXITCODE -ne 0) {
              throw "❌ Tailscale authentication failed."
          }

          Write-Host "✅ Tailscale authentication successful"

          $tsIP = $null

          for ($retry = 1; $retry -le 12; $retry++) {

              try {

                  $candidate =
                    & $tailscaleExe ip -4 2>$null |
                    Select-Object -First 1

                  if ($candidate) {
                      $tsIP = $candidate.ToString().Trim()
                  }

              }
              catch {
                  $tsIP = $null
              }

              if ($tsIP) {
                  break
              }

              Write-Host "⏳ Waiting for Tailscale IPv4... ($retry/12)"
              Start-Sleep -Seconds 5
          }

          if (-not $tsIP) {
              throw "❌ Failed to obtain Tailscale IPv4 address."
          }

          "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

          Write-Host "📍 Tailscale IP: $tsIP"

      # ============================================================
      # VERIFY RDP
      # ============================================================

      - name: 🔍 Verify RDP Connectivity
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "🔍 Testing RDP port 3389..."

          $test = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if (-not $test.TcpTestSucceeded) {
              throw "❌ RDP port 3389 is not reachable."
          }

          Write-Host "✅ RDP port 3389 is reachable"
          Write-Host "📍 Target: $env:TAILSCALE_IP"

      # ============================================================
      # TELEGRAM
      # ============================================================

      - name: 📲 Install Telegram Desktop (latest)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "📲 Downloading latest Telegram Desktop..."

          $tgUrl =
            "https://telegram.org/dl/desktop/win64"

          $tgInstaller =
            "$env:TEMP\tsetup.exe"

          Invoke-WebRequest `
            -Uri $tgUrl `
            -OutFile $tgInstaller `
            -UseBasicParsing

          if (-not (Test-Path $tgInstaller)) {
              throw "❌ Telegram installer download failed."
          }

          Write-Host "📲 Installing Telegram Desktop..."

          $process = Start-Process `
            -FilePath $tgInstaller `
            -ArgumentList @(
              "/VERYSILENT",
              "/SUPPRESSMSGBOXES",
              "/NORESTART"
            ) `
            -Wait `
            -PassThru

          if ($process.ExitCode -ne 0) {
              throw "❌ Telegram installation failed with exit code $($process.ExitCode)."
          }

          Remove-Item `
            $tgInstaller `
            -Force `
            -ErrorAction SilentlyContinue

          Write-Host "✅ Telegram Desktop installed"

      # ============================================================
      # CLOUDFLARE WARP
      # ============================================================

      - name: ☁️ Install Cloudflare WARP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "☁️ Downloading latest Cloudflare WARP..."

          $warpUrl =
            "https://1111-releases.cloudflareclient.com/windows/" +
            "Cloudflare_WARP_Release-x64.msi"

          $warpInstaller =
            "$env:TEMP\warp.msi"

          Invoke-WebRequest `
            -Uri $warpUrl `
            -OutFile $warpInstaller `
            -UseBasicParsing

          if (-not (Test-Path $warpInstaller)) {
              throw "❌ WARP installer download failed."
          }

          Write-Host "☁️ Installing Cloudflare WARP..."

          $process = Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList @(
              "/i",
              "`"$warpInstaller`"",
              "/quiet",
              "/norestart"
            ) `
            -Wait `
            -PassThru

          if ($process.ExitCode -ne 0) {
              throw "❌ WARP installation failed with exit code $($process.ExitCode)."
          }

          Remove-Item `
            $warpInstaller `
            -Force `
            -ErrorAction SilentlyContinue

          Write-Host "✅ Cloudflare WARP installed"
          Write-Host "☁️ WARP remains OFF"

      # ============================================================
      # FINAL ENVIRONMENT CHECK
      # ============================================================

      - name: ✅ Final Environment Check
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          Write-Host "🖥️ WINDOWS ENVIRONMENT"
          Write-Host "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          Get-ComputerInfo `
            -Property `
              WindowsProductName,
              WindowsVersion,
              OsBuildNumber |
            Format-List

          Write-Host ""
          Write-Host "🌐 TAILSCALE"

          $tailscaleExe =
            "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $tailscaleExe version

          Write-Host ""
          Write-Host "📍 Tailscale IPv4:"
          Write-Host $env:TAILSCALE_IP

          Write-Host ""
          Write-Host "👤 RDP User:"
          Write-Host $env:RDP_USERNAME

          Write-Host ""
          Write-Host "🌙 Windows Theme:"
          Write-Host "Dark Mode task configured for ATOMA"

          Write-Host ""
          Write-Host "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          Write-Host "✅ ALL SETUP STEPS COMPLETED"
          Write-Host "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      # ============================================================
      # KEEP ALIVE
      # ============================================================

      - name: ⏳ Keep Alive & Display Connection Info
        shell: pwsh
        run: |
          $minutesInput =
            "${{ github.event.inputs.session_minutes }}"

          if ([string]::IsNullOrWhiteSpace($minutesInput)) {
              $minutesInput = "60"
          }

          $minutes = [int]$minutesInput

          if ($minutes -gt 350) {
              Write-Host "⚠️ session_minutes capped at 350 minutes"
              $minutes = 350
          }

          if ($minutes -lt 1) {
              throw "❌ session_minutes must be at least 1."
          }

          $endTime =
            (Get-Date).AddMinutes($minutes)

          Write-Host ""
          Write-Host "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          Write-Host "🟢 TEMPORARY RDP SESSION IS READY"
          Write-Host "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          Write-Host "👤 Username       : $env:RDP_USERNAME"
          Write-Host "🌐 Tailscale IP   : $env:TAILSCALE_IP"
          Write-Host "🔐 Password       : hidden"
          Write-Host "🌙 Windows Theme  : Dark"
          Write-Host "📦 Tailscale      : v$env:TAILSCALE_VERSION"
          Write-Host "📲 Telegram       : Installed"
          Write-Host "☁️ WARP           : Installed / OFF"
          Write-Host "🔐 RDP NLA        : Enabled"
          Write-Host "⏱️ Duration       : $minutes minutes"
          Write-Host "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          Write-Host ""

          while ((Get-Date) -lt $endTime) {

              $remaining =
                [math]::Ceiling(
                  (
                    New-TimeSpan `
                      -Start (Get-Date) `
                      -End $endTime
                  ).TotalMinutes
                )

              Write-Host `
                "[$(Get-Date -Format 'HH:mm:ss')] 🟢 Session alive... ($remaining min remaining)"

              Start-Sleep -Seconds 300
          }

          Write-Host ""
          Write-Host "⏹️ Session duration reached."
          Write-Host "🗑️ GitHub-hosted runner will be destroyed."

name: 🪟 Windows 2025 Server TEMP RDP

on:
  workflow_dispatch:
    inputs:
      session_minutes:
        description: "How long to keep the session alive (minutes)"
        required: false
        default: "360"

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      RDP_USERNAME: ATOMA
      RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}

      # Current Tailscale stable release as of 2026-09-11
      TAILSCALE_VERSION: "1.102.4"

    steps:
      - name: 🖥️ Enable Remote Desktop
        shell: pwsh
        run: |
          Write-Host "🖥️ Enabling Remote Desktop Services..."

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'SecurityLayer' `
            -Value 0 `
            -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale" | Out-Null
          netsh advfirewall firewall add rule `
            name="RDP-Tailscale" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389 | Out-Null

          Restart-Service -Name TermService -Force

          Write-Host "✅ RDP service restarted & firewall rule added"

      - name: 👤 Create Administrator User
        shell: pwsh
        run: |
          Write-Host "👤 Setting up user: $env:RDP_USERNAME"

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
              Write-Error "❌ RDP_PASSWORD secret is empty or missing"
              exit 1
          }

          $securePass = ConvertTo-SecureString `
            $env:RDP_PASSWORD `
            -AsPlainText `
            -Force

          $existingUser = Get-LocalUser `
            -Name $env:RDP_USERNAME `
            -ErrorAction SilentlyContinue

          if (-not $existingUser) {
              New-LocalUser `
                -Name $env:RDP_USERNAME `
                -Password $securePass `
                -AccountNeverExpires `
                -PasswordNeverExpires `
                -Description "Temporary RDP administrator"

              Write-Host "✅ User created successfully"
          }
          else {
              Write-Host "ℹ️ User already exists – reusing"
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $env:RDP_USERNAME `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $env:RDP_USERNAME `
            -ErrorAction SilentlyContinue

          Write-Host "🔑 User granted Administrator & Remote Desktop rights"

      - name: 🌙 Switch ATOMA to Dark Mode
        shell: pwsh
        run: |
          Write-Host "🌙 Configuring Windows Dark Mode for $env:RDP_USERNAME..."

          $user = Get-LocalUser `
            -Name $env:RDP_USERNAME `
            -ErrorAction Stop

          $sid = $user.SID.Value

          $personalizePath = `
            "Registry::HKEY_USERS\$sid\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize"

          New-Item `
            -Path $personalizePath `
            -Force | Out-Null

          # 0 = Dark mode
          # 1 = Light mode
          New-ItemProperty `
            -Path $personalizePath `
            -Name "AppsUseLightTheme" `
            -PropertyType DWord `
            -Value 0 `
            -Force | Out-Null

          New-ItemProperty `
            -Path $personalizePath `
            -Name "SystemUsesLightTheme" `
            -PropertyType DWord `
            -Value 0 `
            -Force | Out-Null

          # Optional Windows visual settings
          New-ItemProperty `
            -Path $personalizePath `
            -Name "EnableTransparency" `
            -PropertyType DWord `
            -Value 1 `
            -Force | Out-Null

          Write-Host "✅ Dark Mode configured for $env:RDP_USERNAME"
          Write-Host "   AppsUseLightTheme   = 0"
          Write-Host "   SystemUsesLightTheme = 0"

      - name: 🌐 Install Tailscale ${{ env.TAILSCALE_VERSION }}
        shell: pwsh
        run: |
          Write-Host "🌐 Installing Tailscale v$env:TAILSCALE_VERSION..."

          $tsUrl = `
            "https://pkgs.tailscale.com/stable/" +
            "tailscale-setup-$env:TAILSCALE_VERSION-amd64.msi"

          $installerPath = "$env:TEMP\tailscale-$env:TAILSCALE_VERSION.msi"

          Write-Host "⬇️ Download URL:"
          Write-Host $tsUrl

          Invoke-WebRequest `
            -Uri $tsUrl `
            -OutFile $installerPath `
            -UseBasicParsing

          if (-not (Test-Path $installerPath)) {
              Write-Error "❌ Tailscale installer download failed"
              exit 1
          }

          Write-Host "📦 Installing Tailscale..."

          $process = Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList @(
              "/i",
              "`"$installerPath`"",
              "/quiet",
              "/norestart"
            ) `
            -Wait `
            -PassThru

          if ($process.ExitCode -ne 0) {
              Write-Error "❌ Tailscale installation failed with exit code $($process.ExitCode)"
              exit $process.ExitCode
          }

          Remove-Item $installerPath -Force -ErrorAction SilentlyContinue

          $tailscaleExe = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscaleExe)) {
              Write-Error "❌ tailscale.exe was not found after installation"
              exit 1
          }

          Write-Host "✅ Tailscale installed successfully"

          Write-Host "🔎 Installed Tailscale version:"
          & $tailscaleExe version

      - name: 🔗 Connect to Tailscale Mesh
        shell: pwsh
        run: |
          Write-Host "🔗 Authenticating & joining Tailscale network..."

          if ([string]::IsNullOrWhiteSpace("${{ secrets.TAILSCALE_AUTHKEY }}")) {
              Write-Error "❌ TAILSCALE_AUTHKEY secret is missing"
              exit 1
          }

          $tailscaleExe = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $tailscaleExe up `
            --authkey="${{ secrets.TAILSCALE_AUTHKEY }}" `
            --hostname="gh-runner-$env:GITHUB_RUN_ID"

          if ($LASTEXITCODE -ne 0) {
              Write-Error "❌ Tailscale authentication/join failed"
              exit $LASTEXITCODE
          }

          Write-Host "✅ Tailscale authentication successful"

          $tsIP = $null
          $retries = 0

          while (-not $tsIP -and $retries -lt 12) {
              try {
                  $tsIP = (& $tailscaleExe ip -4 2>$null | Select-Object -First 1).Trim()
              }
              catch {
                  $tsIP = $null
              }

              if ($tsIP) {
                  break
              }

              Write-Host "⏳ Waiting for Tailscale IP..."
              Start-Sleep -Seconds 5
              $retries++
          }

          if (-not $tsIP) {
              Write-Error "❌ Failed to obtain Tailscale IPv4 address"
              exit 1
          }

          "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

          Write-Host "📍 Tailscale IP: $tsIP"

      - name: 🔍 Verify RDP Connectivity
        shell: pwsh
        run: |
          Write-Host "🔍 Testing RDP port 3389 on $env:TAILSCALE_IP..."

          $test = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if (-not $test.TcpTestSucceeded) {
              Write-Error "❌ RDP port is not reachable"
              exit 1
          }

          Write-Host "✅ RDP port is open and reachable"

      - name: 📲 Install Telegram Desktop (latest)
        shell: pwsh
        run: |
          Write-Host "📲 Downloading latest Telegram Desktop..."

          $tgUrl = "https://telegram.org/dl/desktop/win64"
          $tgInstaller = "$env:TEMP\tsetup.exe"

          Invoke-WebRequest `
            -Uri $tgUrl `
            -OutFile $tgInstaller `
            -UseBasicParsing

          if (-not (Test-Path $tgInstaller)) {
              Write-Error "❌ Telegram installer download failed"
              exit 1
          }

          Write-Host "📲 Installing Telegram Desktop silently..."

          $process = Start-Process `
            -FilePath $tgInstaller `
            -ArgumentList @(
              "/VERYSILENT",
              "/SUPPRESSMSGBOXES",
              "/NORESTART"
            ) `
            -Wait `
            -PassThru

          if ($process.ExitCode -ne 0) {
              Write-Error "❌ Telegram installation failed with exit code $($process.ExitCode)"
              exit $process.ExitCode
          }

          Remove-Item $tgInstaller -Force -ErrorAction SilentlyContinue

          Write-Host "✅ Telegram Desktop installed"

      - name: ☁️ Install Cloudflare WARP
        shell: pwsh
        run: |
          Write-Host "☁️ Downloading latest Cloudflare WARP..."

          $warpUrl = `
            "https://1111-releases.cloudflareclient.com/windows/" +
            "Cloudflare_WARP_Release-x64.msi"

          $warpInstaller = "$env:TEMP\warp.msi"

          Invoke-WebRequest `
            -Uri $warpUrl `
            -OutFile $warpInstaller `
            -UseBasicParsing

          if (-not (Test-Path $warpInstaller)) {
              Write-Error "❌ WARP installer download failed"
              exit 1
          }

          Write-Host "☁️ Installing Cloudflare WARP silently..."

          $process = Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList @(
              "/i",
              "`"$warpInstaller`"",
              "/quiet",
              "/norestart"
            ) `
            -Wait `
            -PassThru

          if ($process.ExitCode -ne 0) {
              Write-Error "❌ WARP installation failed with exit code $($process.ExitCode)"
              exit $process.ExitCode
          }

          Remove-Item $warpInstaller -Force -ErrorAction SilentlyContinue

          # Deliberately do not enable WARP automatically.
          # Tailscale is already providing the RDP path.
          Write-Host "✅ Cloudflare WARP installed and left disconnected"

      - name: 🖥️ Final Windows Environment Check
        shell: pwsh
        run: |
          Write-Host "🖥️ Windows environment:"
          Get-ComputerInfo -Property `
            WindowsProductName,
            WindowsVersion,
            OsBuildNumber | Format-List

          Write-Host "🌓 Dark Mode registry values for $env:RDP_USERNAME:"

          $user = Get-LocalUser -Name $env:RDP_USERNAME
          $sid = $user.SID.Value

          $personalizePath = `
            "Registry::HKEY_USERS\$sid\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize"

          $appsMode = `
            (Get-ItemProperty `
              -Path $personalizePath `
              -Name AppsUseLightTheme).AppsUseLightTheme

          $systemMode = `
            (Get-ItemProperty `
              -Path $personalizePath `
              -Name SystemUsesLightTheme).SystemUsesLightTheme

          Write-Host "   AppsUseLightTheme    = $appsMode"
          Write-Host "   SystemUsesLightTheme = $systemMode"

          if ($appsMode -eq 0 -and $systemMode -eq 0) {
              Write-Host "✅ Dark Mode is configured"
          }
          else {
              Write-Warning "⚠️ Dark Mode registry values were not set as expected"
          }

      - name: ⏳ Keep Alive & Display Connection Info
        shell: pwsh
        run: |
          $minutesInput = "${{ github.event.inputs.session_minutes }}"

          if ([string]::IsNullOrWhiteSpace($minutesInput)) {
              $minutesInput = "60"
          }

          $minutes = [int]$minutesInput

          if ($minutes -gt 350) {
              Write-Host "⚠️ session_minutes capped at 350 minutes"
              $minutes = 350
          }

          if ($minutes -lt 1) {
              Write-Error "❌ session_minutes must be at least 1"
              exit 1
          }

          $endTime = (Get-Date).AddMinutes($minutes)

          Write-Host ""
          Write-Host "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          Write-Host "🟢 TEMPORARY RDP SESSION IS READY"
          Write-Host "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          Write-Host "👤 Username       : $env:RDP_USERNAME"
          Write-Host "🌐 Tailscale IP   : $env:TAILSCALE_IP"
          Write-Host "🔐 Password       : (hidden – GitHub Secret)"
          Write-Host "🌙 Windows Theme  : Dark"
          Write-Host "📦 Tailscale      : v$env:TAILSCALE_VERSION"
          Write-Host "📲 Telegram       : Installed"
          Write-Host "☁️ WARP           : Installed / OFF"
          Write-Host "⏱️ Duration       : $minutes minutes"
          Write-Host "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          Write-Host ""

          while ((Get-Date) -lt $endTime) {
              $remaining = [math]::Ceiling(
                (New-TimeSpan `
                  -Start (Get-Date) `
                  -End $endTime
                ).TotalMinutes
              )

              Write-Host "[$(Get-Date -Format 'HH:mm:ss')] 🟢 Session alive... ($remaining min remaining)"

              Start-Sleep -Seconds 300
          }

          Write-Host ""
          Write-Host "⏹️ Session duration reached."
          Write-Host "🗑️ GitHub-hosted runner will be destroyed after the job ends."

name: 🪟 Windows 2025 Server TEMP RDP

on:
  workflow_dispatch:
    inputs:
      session_minutes:
        description: "How long to keep the session alive (minutes)"
        required: false
        default: "360"

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      RDP_USERNAME: ATOMA
      RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}

      # Current Tailscale stable version
      TAILSCALE_VERSION: "1.102.4"

    steps:

      # ============================================================
      # RDP
      # ============================================================

      - name: 🖥️ Enable Remote Desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "🖥️ Enabling Remote Desktop Services..."

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'SecurityLayer' `
            -Value 0 `
            -Force

          Write-Host "🔥 Configuring Windows Firewall..."

          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null | Out-Null

          netsh advfirewall firewall add rule `
            name="RDP-Tailscale" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389 | Out-Null

          Restart-Service -Name TermService -Force

          Write-Host "✅ RDP service restarted"
          Write-Host "✅ Firewall rule added"

      # ============================================================
      # USER
      # ============================================================

      - name: 👤 Create Administrator User
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "👤 Setting up user: $env:RDP_USERNAME"

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
              Write-Error "❌ RDP_PASSWORD secret is empty or missing"
              exit 1
          }

          $securePass = ConvertTo-SecureString `
            $env:RDP_PASSWORD `
            -AsPlainText `
            -Force

          $existingUser = Get-LocalUser `
            -Name $env:RDP_USERNAME `
            -ErrorAction SilentlyContinue

          if (-not $existingUser) {

              New-LocalUser `
                -Name $env:RDP_USERNAME `
                -Password $securePass `
                -AccountNeverExpires `
                -PasswordNeverExpires `
                -Description "Temporary RDP administrator"

              Write-Host "✅ User created successfully"

          }
          else {

              Write-Host "ℹ️ User already exists – reusing"

              # Keep the password synchronized with the GitHub Secret.
              $localUser = Get-LocalUser -Name $env:RDP_USERNAME

              Set-LocalUser `
                -Name $env:RDP_USERNAME `
                -Password $securePass

              Write-Host "✅ Existing user password updated"
          }

          # Administrator membership
          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $env:RDP_USERNAME `
            -ErrorAction SilentlyContinue

          # Remote Desktop membership
          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $env:RDP_USERNAME `
            -ErrorAction SilentlyContinue

          Write-Host "✅ Administrator membership configured"
          Write-Host "✅ Remote Desktop Users membership configured"

          Get-LocalUser -Name $env:RDP_USERNAME |
            Select-Object Name, Enabled, Description

      # ============================================================
      # DARK MODE
      # ============================================================

      - name: 🌙 Configure Windows Dark Mode
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "🌙 Configuring Windows Dark Mode for $env:RDP_USERNAME..."

          $profileRoot = "C:\Users\$env:RDP_USERNAME"
          $userHiveFile = Join-Path $profileRoot "NTUSER.DAT"
          $defaultHiveFile = "C:\Users\Default\NTUSER.DAT"

          $tempHiveName = "ATOMA_THEME_TEMP"

          Write-Host "📂 Checking user profile..."

          # ----------------------------------------------------------
          # Helper function
          # ----------------------------------------------------------

          function Set-DarkModeInHive {
              param (
                  [Parameter(Mandatory = $true)]
                  [string]$HiveName
              )

              $personalizePath =
                  "Registry::HKEY_USERS\$HiveName\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize"

              Write-Host "🌓 Configuring Personalize registry key..."

              New-Item `
                  -Path $personalizePath `
                  -Force | Out-Null

              # 0 = Dark
              # 1 = Light

              New-ItemProperty `
                  -Path $personalizePath `
                  -Name "AppsUseLightTheme" `
                  -PropertyType DWord `
                  -Value 0 `
                  -Force | Out-Null

              New-ItemProperty `
                  -Path $personalizePath `
                  -Name "SystemUsesLightTheme" `
                  -PropertyType DWord `
                  -Value 0 `
                  -Force | Out-Null

              # Windows transparency
              New-ItemProperty `
                  -Path $personalizePath `
                  -Name "EnableTransparency" `
                  -PropertyType DWord `
                  -Value 1 `
                  -Force | Out-Null

              $appsMode =
                  (Get-ItemProperty `
                      -Path $personalizePath `
                      -Name "AppsUseLightTheme").AppsUseLightTheme

              $systemMode =
                  (Get-ItemProperty `
                      -Path $personalizePath `
                      -Name "SystemUsesLightTheme").SystemUsesLightTheme

              Write-Host "   AppsUseLightTheme    = $appsMode"
              Write-Host "   SystemUsesLightTheme = $systemMode"

              if ($appsMode -ne 0 -or $systemMode -ne 0) {
                  throw "Dark Mode verification failed."
              }

              Write-Host "✅ Dark Mode verified"
          }

          # ----------------------------------------------------------
          # Make sure our temporary hive isn't already loaded
          # ----------------------------------------------------------

          & reg.exe unload "HKU\$tempHiveName" 2>$null | Out-Null

          # ----------------------------------------------------------
          # CASE 1:
          # ATOMA profile already exists
          # ----------------------------------------------------------

          if (Test-Path $userHiveFile) {

              Write-Host "📁 Existing ATOMA profile detected:"
              Write-Host "   $userHiveFile"

              Write-Host "📂 Loading ATOMA NTUSER.DAT..."

              $loadOutput = & reg.exe load `
                  "HKU\$tempHiveName" `
                  "$userHiveFile" 2>&1

              if ($LASTEXITCODE -ne 0) {

                  Write-Host $loadOutput

                  throw "❌ Failed to load ATOMA's NTUSER.DAT"
              }

              try {

                  Set-DarkModeInHive -HiveName $tempHiveName

              }
              finally {

                  Write-Host "📤 Unloading ATOMA registry hive..."

                  $unloadOutput = & reg.exe unload `
                      "HKU\$tempHiveName" 2>&1

                  if ($LASTEXITCODE -ne 0) {
                      Write-Host $unloadOutput
                      throw "❌ Failed to unload ATOMA registry hive"
                  }

                  Write-Host "✅ ATOMA registry hive unloaded"
              }

          }

          # ----------------------------------------------------------
          # CASE 2:
          # No profile yet
          #
          # Configure Default User so ATOMA inherits Dark Mode
          # when Windows creates the profile during first logon.
          # ----------------------------------------------------------

          else {

              Write-Host "ℹ️ ATOMA profile does not exist yet."
              Write-Host "📁 Using Default User profile instead."

              if (-not (Test-Path $defaultHiveFile)) {
                  throw "❌ Default user NTUSER.DAT not found: $defaultHiveFile"
              }

              Write-Host "📂 Loading Default User registry hive..."

              $loadOutput = & reg.exe load `
                  "HKU\$tempHiveName" `
                  "$defaultHiveFile" 2>&1

              if ($LASTEXITCODE -ne 0) {

                  Write-Host $loadOutput

                  throw "❌ Failed to load Default User registry hive"
              }

              try {

                  Set-DarkModeInHive -HiveName $tempHiveName

              }
              finally {

                  Write-Host "📤 Unloading Default User registry hive..."

                  $unloadOutput = & reg.exe unload `
                      "HKU\$tempHiveName" 2>&1

                  if ($LASTEXITCODE -ne 0) {
                      Write-Host $unloadOutput
                      throw "❌ Failed to unload Default User registry hive"
                  }

                  Write-Host "✅ Default User registry hive unloaded"
              }

              Write-Host ""
              Write-Host "✅ ATOMA will inherit Dark Mode when its Windows profile is created."
          }

          Write-Host ""
          Write-Host "🌙 Windows Dark Mode configuration complete."

      # ============================================================
      # TAILSCALE
      # ============================================================

      - name: 🌐 Install Tailscale v${{ env.TAILSCALE_VERSION }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "🌐 Installing Tailscale v$env:TAILSCALE_VERSION..."

          $tsUrl =
              "https://pkgs.tailscale.com/stable/" +
              "tailscale-setup-$env:TAILSCALE_VERSION-amd64.msi"

          $installerPath =
              "$env:TEMP\tailscale-$env:TAILSCALE_VERSION.msi"

          Write-Host "⬇️ Downloading:"
          Write-Host $tsUrl

          Invoke-WebRequest `
              -Uri $tsUrl `
              -OutFile $installerPath `
              -UseBasicParsing

          if (-not (Test-Path $installerPath)) {
              throw "❌ Tailscale installer download failed."
          }

          Write-Host "📦 Installing Tailscale..."

          $process = Start-Process `
              -FilePath "msiexec.exe" `
              -ArgumentList @(
                  "/i",
                  "`"$installerPath`"",
                  "/quiet",
                  "/norestart"
              ) `
              -Wait `
              -PassThru

          if ($process.ExitCode -ne 0) {
              throw "❌ Tailscale installation failed with exit code $($process.ExitCode)"
          }

          Remove-Item `
              $installerPath `
              -Force `
              -ErrorAction SilentlyContinue

          $tailscaleExe =
              "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscaleExe)) {
              throw "❌ tailscale.exe was not found after installation."
          }

          Write-Host "✅ Tailscale installed successfully"

          Write-Host "🔎 Installed version:"
          & $tailscaleExe version

      # ============================================================
      # TAILSCALE CONNECTION
      # ============================================================

      - name: 🔗 Connect to Tailscale Mesh
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "🔗 Authenticating & joining Tailscale network..."

          if ([string]::IsNullOrWhiteSpace("${{ secrets.TAILSCALE_AUTHKEY }}")) {
              throw "❌ TAILSCALE_AUTHKEY secret is missing."
          }

          $tailscaleExe =
              "$env:ProgramFiles\Tailscale\tailscale.exe"

          $hostname =
              "gh-runner-$env:GITHUB_RUN_ID"

          & $tailscaleExe up `
              --authkey="${{ secrets.TAILSCALE_AUTHKEY }}" `
              --hostname="$hostname"

          if ($LASTEXITCODE -ne 0) {
              throw "❌ Tailscale authentication failed."
          }

          Write-Host "✅ Tailscale authentication successful"

          $tsIP = $null

          for ($retry = 1; $retry -le 12; $retry++) {

              try {

                  $candidate =
                      & $tailscaleExe ip -4 2>$null |
                      Select-Object -First 1

                  if ($candidate) {
                      $tsIP = $candidate.ToString().Trim()
                  }

              }
              catch {
                  $tsIP = $null
              }

              if ($tsIP) {
                  break
              }

              Write-Host "⏳ Waiting for Tailscale IPv4 address... ($retry/12)"
              Start-Sleep -Seconds 5
          }

          if (-not $tsIP) {
              throw "❌ Failed to obtain Tailscale IPv4 address."
          }

          "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

          Write-Host "📍 Tailscale IP: $tsIP"

      # ============================================================
      # RDP CONNECTIVITY
      # ============================================================

      - name: 🔍 Verify RDP Connectivity
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "🔍 Testing RDP port 3389..."

          $test = Test-NetConnection `
              -ComputerName $env:TAILSCALE_IP `
              -Port 3389 `
              -WarningAction SilentlyContinue

          if (-not $test.TcpTestSucceeded) {
              throw "❌ RDP port 3389 is not reachable."
          }

          Write-Host "✅ RDP port 3389 is reachable"
          Write-Host "📍 Target: $env:TAILSCALE_IP"

      # ============================================================
      # TELEGRAM
      # ============================================================

      - name: 📲 Install Telegram Desktop (latest)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "📲 Downloading latest Telegram Desktop..."

          $tgUrl =
              "https://telegram.org/dl/desktop/win64"

          $tgInstaller =
              "$env:TEMP\tsetup.exe"

          Invoke-WebRequest `
              -Uri $tgUrl `
              -OutFile $tgInstaller `
              -UseBasicParsing

          if (-not (Test-Path $tgInstaller)) {
              throw "❌ Telegram installer download failed."
          }

          Write-Host "📲 Installing Telegram Desktop..."

          $process = Start-Process `
              -FilePath $tgInstaller `
              -ArgumentList @(
                  "/VERYSILENT",
                  "/SUPPRESSMSGBOXES",
                  "/NORESTART"
              ) `
              -Wait `
              -PassThru

          if ($process.ExitCode -ne 0) {
              throw "❌ Telegram installation failed with exit code $($process.ExitCode)"
          }

          Remove-Item `
              $tgInstaller `
              -Force `
              -ErrorAction SilentlyContinue

          Write-Host "✅ Telegram Desktop installed"

      # ============================================================
      # CLOUDFLARE WARP
      # ============================================================

      - name: ☁️ Install Cloudflare WARP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "☁️ Downloading latest Cloudflare WARP..."

          $warpUrl =
              "https://1111-releases.cloudflareclient.com/windows/" +
              "Cloudflare_WARP_Release-x64.msi"

          $warpInstaller =
              "$env:TEMP\warp.msi"

          Invoke-WebRequest `
              -Uri $warpUrl `
              -OutFile $warpInstaller `
              -UseBasicParsing

          if (-not (Test-Path $warpInstaller)) {
              throw "❌ WARP installer download failed."
          }

          Write-Host "☁️ Installing Cloudflare WARP..."

          $process = Start-Process `
              -FilePath "msiexec.exe" `
              -ArgumentList @(
                  "/i",
                  "`"$warpInstaller`"",
                  "/quiet",
                  "/norestart"
              ) `
              -Wait `
              -PassThru

          if ($process.ExitCode -ne 0) {
              throw "❌ WARP installation failed with exit code $($process.ExitCode)"
          }

          Remove-Item `
              $warpInstaller `
              -Force `
              -ErrorAction SilentlyContinue

          # WARP stays OFF.
          # Tailscale is being used for the RDP path.

          Write-Host "✅ Cloudflare WARP installed"
          Write-Host "☁️ WARP remains disconnected"

      # ============================================================
      # FINAL STATUS
      # ============================================================

      - name: ✅ Final Environment Check
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          Write-Host "🖥️ WINDOWS ENVIRONMENT"
          Write-Host "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          Get-ComputerInfo `
              -Property `
              WindowsProductName,
              WindowsVersion,
              OsBuildNumber |
              Format-List

          Write-Host ""
          Write-Host "🌐 TAILSCALE"

          $tailscaleExe =
              "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $tailscaleExe version

          Write-Host ""
          Write-Host "📍 Tailscale IPv4:"
          Write-Host $env:TAILSCALE_IP

          Write-Host ""
          Write-Host "🌙 Theme configuration:"
          Write-Host "Dark Mode requested for user: $env:RDP_USERNAME"

          Write-Host ""
          Write-Host "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          Write-Host "✅ ALL SETUP STEPS COMPLETED"
          Write-Host "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      # ============================================================
      # KEEP ALIVE
      # ============================================================

      - name: ⏳ Keep Alive & Display Connection Info
        shell: pwsh
        run: |
          $minutesInput =
              "${{ github.event.inputs.session_minutes }}"

          if ([string]::IsNullOrWhiteSpace($minutesInput)) {
              $minutesInput = "60"
          }

          $minutes = [int]$minutesInput

          if ($minutes -gt 350) {
              Write-Host "⚠️ session_minutes capped at 350 minutes"
              $minutes = 350
          }

          if ($minutes -lt 1) {
              throw "❌ session_minutes must be at least 1"
          }

          $endTime =
              (Get-Date).AddMinutes($minutes)

          Write-Host ""
          Write-Host "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          Write-Host "🟢 TEMPORARY RDP SESSION IS READY"
          Write-Host "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          Write-Host "👤 Username       : $env:RDP_USERNAME"
          Write-Host "🌐 Tailscale IP   : $env:TAILSCALE_IP"
          Write-Host "🔐 Password       : hidden"
          Write-Host "🌙 Windows Theme  : Dark"
          Write-Host "📦 Tailscale      : v$env:TAILSCALE_VERSION"
          Write-Host "📲 Telegram       : Installed"
          Write-Host "☁️ WARP           : Installed / OFF"
          Write-Host "⏱️ Duration       : $minutes minutes"
          Write-Host "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          Write-Host ""

          while ((Get-Date) -lt $endTime) {

              $remaining =
                  [math]::Ceiling(
                      (
                          New-TimeSpan `
                              -Start (Get-Date) `
                              -End $endTime
                      ).TotalMinutes
                  )

              Write-Host `
                  "[$(Get-Date -Format 'HH:mm:ss')] 🟢 Session alive... ($remaining min remaining)"

              Start-Sleep -Seconds 300
          }

          Write-Host ""
          Write-Host "⏹️ Session duration reached."
          Write-Host "🗑️ GitHub-hosted runner will be destroyed."

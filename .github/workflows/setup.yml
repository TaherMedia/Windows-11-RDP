name: "🪟 Windows 2025 Server TEMP RDP"

on:
  workflow_dispatch:
    inputs:
      session_minutes:
        description: "Session duration in minutes (maximum 355)"
        required: false
        default: "355"
        type: string

permissions:
  contents: read

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      RDP_USERNAME: ATOMA
      RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      SESSION_MINUTES: ${{ inputs.session_minutes }}

    steps:
      # ==========================================================
      # 1. Validate secrets
      # ==========================================================
      - name: "🔐 Validate required secrets"
        shell: pwsh
        run: |
          Write-Output "::group::Secret validation"
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
              throw "Missing secret: RDP_PASSWORD"
          }

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTHKEY)) {
              throw "Missing secret: TAILSCALE_AUTHKEY"
          }

          Write-Output "::notice::All required secrets are configured."
          Write-Output "::endgroup::"

      # ==========================================================
      # 2. Configure secure RDP
      # ==========================================================
      - name: "🖥️ Enable secure Remote Desktop"
        shell: pwsh
        run: |
          Write-Output "::group::RDP configuration"
          $ErrorActionPreference = "Stop"

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' `
            -Value 1

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'SecurityLayer' `
            -Value 2

          Get-NetFirewallRule `
            -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue |
            Disable-NetFirewallRule

          Get-NetFirewallRule `
            -Name "RDP-Tailscale-Only" `
            -ErrorAction SilentlyContinue |
            Remove-NetFirewallRule

          New-NetFirewallRule `
            -Name "RDP-Tailscale-Only" `
            -DisplayName "RDP - Tailscale network only" `
            -Direction Inbound `
            -Action Allow `
            -Protocol TCP `
            -LocalPort 3389 `
            -RemoteAddress "100.64.0.0/10" `
            -Profile Any

          Set-Service -Name TermService -StartupType Automatic
          Restart-Service -Name TermService -Force

          Write-Output "::notice::RDP enabled with NLA, TLS and a Tailscale-only firewall rule."
          Write-Output "::endgroup::"

      # ==========================================================
      # 3. Create the ATOMA administrator account
      # ==========================================================
      - name: "👤 Create or update ATOMA"
        shell: pwsh
        run: |
          Write-Output "::group::ATOMA account setup"
          $ErrorActionPreference = "Stop"

          $securePass = ConvertTo-SecureString `
            $env:RDP_PASSWORD -AsPlainText -Force

          $user = Get-LocalUser `
            -Name $env:RDP_USERNAME `
            -ErrorAction SilentlyContinue

          if ($null -eq $user) {
              New-LocalUser `
                -Name $env:RDP_USERNAME `
                -Password $securePass `
                -Description "Temporary RDP administrator" `
                -AccountNeverExpires `
                -PasswordNeverExpires
          } else {
              Set-LocalUser `
                -Name $env:RDP_USERNAME `
                -Password $securePass `
                -PasswordNeverExpires $true
          }

          foreach ($group in @("Administrators", "Remote Desktop Users")) {
              $members = Get-LocalGroupMember `
                -Group $group `
                -ErrorAction Stop

              $alreadyMember = $members | Where-Object {
                  $_.Name -eq "$env:COMPUTERNAME\$env:RDP_USERNAME"
              }

              if (-not $alreadyMember) {
                  Add-LocalGroupMember `
                    -Group $group `
                    -Member $env:RDP_USERNAME
              }
          }

          Write-Output "::notice::User ATOMA is configured with administrator and RDP access."
          Write-Output "::endgroup::"

      # ==========================================================
      # 4. Install Tailscale machine-wide using WinGet
      # ==========================================================
      - name: "🌐 Install Tailscale with WinGet"
        shell: pwsh
        run: |
          Write-Output "::group::Tailscale installation"
          $ErrorActionPreference = "Stop"

          winget install `
            --id Tailscale.Tailscale `
            --exact `
            --source winget `
            --scope machine `
            --silent `
            --accept-source-agreements `
            --accept-package-agreements `
            --disable-interactivity

          if ($LASTEXITCODE -ne 0) {
              throw "Tailscale installation failed: $LASTEXITCODE"
          }

          $tailscaleExe = Join-Path `
            $env:ProgramFiles "Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscaleExe)) {
              throw "Tailscale executable not found."
          }

          & $tailscaleExe version
          Write-Output "::notice::Tailscale installed machine-wide."
          Write-Output "::endgroup::"

      # ==========================================================
      # 5. Connect Tailscale (verbose logs suppressed)
      # ==========================================================
      - name: "🔗 Connect to Tailscale"
        shell: pwsh
        run: |
          Write-Output "::group::Tailscale connection"
          $ErrorActionPreference = "Stop"

          $tailscaleExe = Join-Path `
            $env:ProgramFiles "Tailscale\tailscale.exe"

          $service = Get-Service -Name Tailscale -ErrorAction Stop

          if ($service.Status -ne "Running") {
              Start-Service -Name Tailscale
              $service.WaitForStatus(
                "Running",
                [TimeSpan]::FromSeconds(30)
              )
          }

          & $tailscaleExe up `
            "--authkey=$($env:TAILSCALE_AUTHKEY)" `
            "--hostname=gh-runner-$($env:GITHUB_RUN_ID)" `
            --unattended

          if ($LASTEXITCODE -ne 0) {
              throw "Tailscale authentication or connection failed."
          }

          $tsIP = $null

          for ($i = 0; $i -lt 30; $i++) {
              $candidate = & $tailscaleExe ip -4 2>$null |
                Select-Object -First 1

              if ($candidate -match '^\d{1,3}(\.\d{1,3}){3}$') {
                  $tsIP = $candidate.Trim()
                  break
              }

              Start-Sleep -Seconds 2
          }

          if (-not $tsIP) {
              throw "Could not obtain the Tailscale IPv4 address."
          }

          Add-Content -Path $env:GITHUB_ENV `
            -Value "TAILSCALE_IP=$tsIP"

          Write-Output "::notice::Tailscale IPv4 address: $tsIP"
          Write-Output "::endgroup::"

      # ==========================================================
      # 6. Verify RDP
      # ==========================================================
      - name: "🔍 Verify RDP connectivity"
        shell: pwsh
        run: |
          Write-Output "::group::RDP connectivity check"
          $ErrorActionPreference = "Stop"

          $result = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if (-not $result.TcpTestSucceeded) {
              throw "RDP is not reachable through Tailscale."
          }

          Write-Output "::notice::RDP is reachable over the Tailscale network."
          Write-Output "::endgroup::"

      # ==========================================================
      # 7. Install Cloudflare WARP machine-wide
      # ==========================================================
      - name: "☁️ Install Cloudflare WARP with WinGet"
        shell: pwsh
        run: |
          Write-Output "::group::Cloudflare WARP installation"
          $ErrorActionPreference = "Stop"

          winget install `
            --id Cloudflare.Warp `
            --exact `
            --source winget `
            --scope machine `
            --silent `
            --accept-source-agreements `
            --accept-package-agreements `
            --disable-interactivity

          if ($LASTEXITCODE -ne 0) {
              throw "Cloudflare WARP installation failed: $LASTEXITCODE"
          }

          $warpDir = Join-Path `
            $env:ProgramFiles "Cloudflare\Cloudflare WARP"

          $warpCli = Join-Path $warpDir "warp-cli.exe"

          if (-not (Test-Path $warpCli)) {
              throw "WARP CLI was not found after installation."
          }

          Write-Output "::notice::Cloudflare WARP installed machine-wide."
          Write-Output "::endgroup::"

      # ==========================================================
      # 8. Connect WARP and preserve RDP connectivity
      # ==========================================================
      - name: "🔒 Connect Cloudflare WARP"
        shell: pwsh
        run: |
          Write-Output "::group::Cloudflare WARP connection"
          $ErrorActionPreference = "Stop"

          $warpCli = Join-Path `
            $env:ProgramFiles "Cloudflare\Cloudflare WARP\warp-cli.exe"

          $warpConnected = $false

          try {
              & $warpCli registration new
              & $warpCli connect

              if ($LASTEXITCODE -ne 0) {
                  throw "WARP connection command failed."
              }

              for ($i = 0; $i -lt 12; $i++) {
                  Start-Sleep -Seconds 5

                  $trace = & curl.exe `
                    --silent `
                    --max-time 10 `
                    "https://www.cloudflare.com/cdn-cgi/trace" `
                    2>$null

                  if ($trace -match '(?m)^warp=on$') {
                      $warpConnected = $true
                      break
                  }
              }

              if (-not $warpConnected) {
                  throw "Could not verify an active WARP tunnel."
              }
          } catch {
              Write-Output "::warning::Automatic WARP activation failed: $($_.Exception.Message)"

              Add-Content -Path $env:GITHUB_ENV `
                -Value "WARP_STATE=MANUAL_SETUP_REQUIRED"
          }

          if ($warpConnected) {
              Add-Content -Path $env:GITHUB_ENV `
                -Value "WARP_STATE=CONNECTED"

              Start-Sleep -Seconds 5

              $rdp = Test-NetConnection `
                -ComputerName $env:TAILSCALE_IP `
                -Port 3389 `
                -WarningAction SilentlyContinue

              if (-not $rdp.TcpTestSucceeded) {
                  Write-Output "::warning::WARP affected RDP connectivity; disconnecting WARP."

                  & $warpCli disconnect

                  if ($LASTEXITCODE -ne 0) {
                      throw "Could not disconnect WARP to preserve RDP connectivity."
                  }

                  Add-Content -Path $env:GITHUB_ENV `
                    -Value "WARP_STATE=DISCONNECTED_TO_PRESERVE_RDP"

                  Start-Sleep -Seconds 10

                  $rdp = Test-NetConnection `
                    -ComputerName $env:TAILSCALE_IP `
                    -Port 3389 `
                    -WarningAction SilentlyContinue

                  if (-not $rdp.TcpTestSucceeded) {
                      throw "RDP connectivity did not recover after disconnecting WARP."
                  }
              }
          }

          Write-Output "::notice::WARP state: $env:WARP_STATE"
          Write-Output "::endgroup::"

      # ==========================================================
      # 9. Display RDP details + rich step summary
      # ==========================================================
      - name: "📋 Display RDP connection details"
        shell: pwsh
        run: |
          Write-Output "::group::RDP connection details"
          $ErrorActionPreference = "Stop"

          [int]$minutes = 355

          if (-not [int]::TryParse($env:SESSION_MINUTES, [ref]$minutes)) {
              $minutes = 355
          }

          $minutes = [math]::Max(1, [math]::Min(355, $minutes))

          Write-Output ""
          Write-Output "========================================"
          Write-Output "  TEMPORARY RDP SESSION READY"
          Write-Output "========================================"
          Write-Output "  Username       : $env:RDP_USERNAME"
          Write-Output "  Tailscale IPv4 : $env:TAILSCALE_IP"
          Write-Output "  Password       : Hidden (GitHub Secrets)"
          Write-Output "  Duration       : $minutes minutes"
          Write-Output "  WARP status    : $env:WARP_STATE"
          Write-Output "========================================"
          Write-Output "  Log in as ATOMA to start the per-user app setup."
          Write-Output "  Apps log: C:\ProgramData\ATOMA-AppSetup\install.log"
          Write-Output "========================================"
          Write-Output ""

          # Single-quoted here-string keeps markdown backticks literal.
          # The closing '@ is indented to stay inside the YAML block;
          # PowerShell still sees it at column 0 after YAML de-indentation.
          $summaryTemplate = @'
## 🪟 Temporary RDP Session Ready

| Item | Value |
|------|-------|
| 👤 Username | `{0}` |
| 🌐 Tailscale IPv4 | `{1}` |
| 🔑 Password | Hidden (GitHub Secrets) |
| ⏱️ Duration | **{2} minutes** |
| ☁️ WARP Status | `{3}` |

> **Log in as `ATOMA` to start the per-user app setup.**
> App install log: `C:\ProgramData\ATOMA-AppSetup\install.log`
'@

          $summary = $summaryTemplate -f `
              $env:RDP_USERNAME, `
              $env:TAILSCALE_IP, `
              $minutes, `
              $env:WARP_STATE

          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

          Write-Output "::notice::RDP session ready - user: $env:RDP_USERNAME - IP: $env:TAILSCALE_IP - duration: $minutes minutes"
          Write-Output "::endgroup::"

      # ==========================================================
      # 10. Configure and trigger app installation for ATOMA
      # ==========================================================
      - name: "👤 Configure app installation for ATOMA"
        shell: pwsh
        run: |
          Write-Output "::group::ATOMA app installation setup"
          $ErrorActionPreference = "Stop"

          $root = Join-Path $env:ProgramData "ATOMA-AppSetup"
          New-Item -ItemType Directory -Path $root -Force | Out-Null

          $scriptPath = Join-Path $root "Install-Apps-As-ATOMA.ps1"
          $taskName = "ATOMA-FirstLogon-AppSetup"
          $account = "$($env:COMPUTERNAME)\$($env:RDP_USERNAME)"

          # The closing '@ is indented to remain part of this YAML block scalar.
          $setupScript = @'
$ErrorActionPreference = "Stop"

$root = Join-Path $env:ProgramData "ATOMA-AppSetup"
$logPath = Join-Path $root "install.log"
$statusPath = Join-Path $root "status.txt"
$successPath = Join-Path $root "success.flag"

New-Item -ItemType Directory -Path $root -Force | Out-Null

try {
    Start-Transcript -Path $logPath -Append | Out-Null
} catch {
}

try {
    if (Test-Path $successPath) {
        Write-Host "ATOMA app setup already completed."
        return
    }

    Set-Content -Path $statusPath -Value "RUNNING: Preparing ATOMA apps"

    Write-Host "=========================================="
    Write-Host "Installing applications in the ATOMA user session"
    Write-Host "Windows identity: $([System.Security.Principal.WindowsIdentity]::GetCurrent().Name)"
    Write-Host "=========================================="

    $script:wingetPath = $null

    for ($attempt = 0; $attempt -lt 24; $attempt++) {
        try {
            Add-AppxPackage `
              -RegisterByFamilyName `
              -MainPackage "Microsoft.DesktopAppInstaller_8wekyb3d8bbwe" `
              -ErrorAction Stop
        } catch {
            Write-Host "App Installer registration attempt $($attempt + 1): $($_.Exception.Message)"
        }

        $candidate = Join-Path `
          $env:LOCALAPPDATA "Microsoft\WindowsApps\winget.exe"

        if (Test-Path $candidate) {
            $null = & $candidate --version 2>&1

            if ($LASTEXITCODE -eq 0) {
                $script:wingetPath = $candidate
                break
            }
        }

        $cmd = Get-Command winget.exe -ErrorAction SilentlyContinue

        if ($cmd) {
            $script:wingetPath = $cmd.Source
            break
        }

        Start-Sleep -Seconds 5
    }

    if (-not $script:wingetPath) {
        throw "WinGet is unavailable in the ATOMA session."
    }

    Write-Host "WinGet path for ATOMA: $script:wingetPath"
    & $script:wingetPath --version

    $script:failedPackages = @()

    function Invoke-WingetChecked {
        param(
            [string]$Label,
            [string[]]$Arguments,
            [string]$ExpectedNoChangeRegex = ""
        )

        Write-Host ""
        Write-Host "Installing/updating: $Label"

        $output = & $script:wingetPath @Arguments 2>&1
        $exitCode = $LASTEXITCODE
        $text = ($output | Out-String)

        Write-Host $text

        if ($exitCode -eq 0) {
            Write-Host "$Label completed."
            return $true
        }

        if (
            $ExpectedNoChangeRegex -and
            $text -match $ExpectedNoChangeRegex
        ) {
            Write-Host "$Label does not need an update."
            return $true
        }

        Write-Warning "$Label failed with WinGet exit code $exitCode."
        $script:failedPackages += "$Label (exit code $exitCode)"
        return $false
    }

    # Telegram Desktop (per-user scope)
    Invoke-WingetChecked `
      -Label "Telegram Desktop for ATOMA" `
      -Arguments @(
        "install",
        "--id", "Telegram.TelegramDesktop",
        "--exact",
        "--source", "winget",
        "--scope", "user",
        "--silent",
        "--accept-source-agreements",
        "--accept-package-agreements",
        "--disable-interactivity"
      )

    # WhatsApp (Microsoft Store package; no --scope flag)
    Invoke-WingetChecked `
      -Label "WhatsApp for ATOMA" `
      -Arguments @(
        "install",
        "--id", "9NKSQGP7F2NH",
        "--source", "msstore",
        "--silent",
        "--accept-source-agreements",
        "--accept-package-agreements",
        "--disable-interactivity"
      )

    # Google Chrome (machine scope)
    $chromePaths = @(
        (Join-Path $env:ProgramFiles "Google\Chrome\Application\chrome.exe"),
        (Join-Path ${env:ProgramFiles(x86)} "Google\Chrome\Application\chrome.exe")
    )

    $chromeExe = $chromePaths |
        Where-Object { Test-Path $_ } |
        Select-Object -First 1

    if ($chromeExe) {
        Invoke-WingetChecked `
          -Label "Google Chrome update" `
          -Arguments @(
            "upgrade",
            "--id", "Google.Chrome",
            "--exact",
            "--source", "winget",
            "--scope", "machine",
            "--silent",
            "--accept-source-agreements",
            "--accept-package-agreements",
            "--disable-interactivity"
          ) `
          -ExpectedNoChangeRegex '(?i)No applicable upgrade found|No available upgrade found'
    } else {
        Invoke-WingetChecked `
          -Label "Google Chrome installation" `
          -Arguments @(
            "install",
            "--id", "Google.Chrome",
            "--exact",
            "--source", "winget",
            "--scope", "machine",
            "--silent",
            "--accept-source-agreements",
            "--accept-package-agreements",
            "--disable-interactivity"
          )
    }

    # Create shortcuts on ATOMA's desktop
    $desktop = Join-Path $env:USERPROFILE "Desktop"
    New-Item -ItemType Directory -Path $desktop -Force | Out-Null

    $shell = New-Object -ComObject WScript.Shell

    function New-DesktopShortcut {
        param(
            [string]$Name,
            [string]$Target,
            [string]$Arguments = ""
        )

        if (-not (Test-Path $Target)) {
            Write-Host "Shortcut target not found: $Target"
            return
        }

        $path = Join-Path $desktop "$Name.lnk"
        $shortcut = $shell.CreateShortcut($path)
        $shortcut.TargetPath = $Target

        if ($Arguments) {
            $shortcut.Arguments = $Arguments
        }

        $shortcut.WorkingDirectory = Split-Path $Target -Parent
        $shortcut.Save()

        Write-Host "Created desktop shortcut: $Name"
    }

    $telegramCandidates = @(
        (Join-Path $env:APPDATA "Telegram Desktop\Telegram.exe"),
        (Join-Path $env:LOCALAPPDATA "Programs\Telegram Desktop\Telegram.exe"),
        (Join-Path $env:LOCALAPPDATA "Telegram Desktop\Telegram.exe")
    )

    $telegramExe = $telegramCandidates |
        Where-Object { Test-Path $_ } |
        Select-Object -First 1

    if ($telegramExe) {
        New-DesktopShortcut `
          -Name "Telegram Desktop" `
          -Target $telegramExe
    }

    Start-Sleep -Seconds 3

    $whatsappApp = Get-StartApps |
        Where-Object { $_.Name -match "WhatsApp" } |
        Select-Object -First 1

    if ($whatsappApp) {
        $explorer = Join-Path $env:WINDIR "explorer.exe"

        $shortcutPath = Join-Path $desktop "WhatsApp.lnk"
        $shortcut = $shell.CreateShortcut($shortcutPath)
        $shortcut.TargetPath = $explorer
        $shortcut.Arguments = "shell:AppsFolder\$($whatsappApp.AppID)"
        $shortcut.Save()

        Write-Host "Created WhatsApp desktop shortcut."
    } else {
        Write-Host "WhatsApp Start Menu entry was not found."
    }

    $chromePaths = @(
        (Join-Path $env:ProgramFiles "Google\Chrome\Application\chrome.exe"),
        (Join-Path ${env:ProgramFiles(x86)} "Google\Chrome\Application\chrome.exe")
    )

    $chromeExe = $chromePaths |
        Where-Object { Test-Path $_ } |
        Select-Object -First 1

    if ($chromeExe) {
        New-DesktopShortcut `
          -Name "Google Chrome" `
          -Target $chromeExe
    }

    $tailscaleGui = Join-Path $env:ProgramFiles "Tailscale\ipn.exe"

    if (Test-Path $tailscaleGui) {
        New-DesktopShortcut `
          -Name "Tailscale" `
          -Target $tailscaleGui
    }

    $warpGui = Join-Path `
      $env:ProgramFiles "Cloudflare\Cloudflare WARP\Cloudflare WARP.exe"

    if (Test-Path $warpGui) {
        New-DesktopShortcut `
          -Name "Cloudflare WARP" `
          -Target $warpGui
    }

    if ($script:failedPackages.Count -gt 0) {
        $failureText = $script:failedPackages -join "; "

        Set-Content -Path $statusPath `
          -Value "FAILED: $failureText"

        throw "One or more packages failed: $failureText"
    }

    Set-Content -Path $successPath `
      -Value "Completed at $(Get-Date -Format o)"

    Set-Content -Path $statusPath `
      -Value "SUCCESS: ATOMA apps installed and shortcuts created"

    Write-Host ""
    Write-Host "ATOMA app setup completed successfully."
    Write-Host "Log: $logPath"
} catch {
    $message = "FAILED: $($_.Exception.Message)"
    Set-Content -Path $statusPath -Value $message
    Write-Error $message
    throw
} finally {
    try {
        Stop-Transcript | Out-Null
    } catch {
    }
}
'@

          Set-Content `
            -LiteralPath $scriptPath `
            -Value $setupScript `
            -Encoding UTF8

          # -Password on Register-ScheduledTask is a PLAIN string, not a SecureString.
          $action = New-ScheduledTaskAction `
            -Execute "powershell.exe" `
            -Argument "-NoProfile -ExecutionPolicy Bypass -File `"$scriptPath`""

          $trigger = New-ScheduledTaskTrigger -Once -At (Get-Date).AddMinutes(1)

          $principal = New-ScheduledTaskPrincipal `
            -UserId $account `
            -LogonType Password `
            -RunLevel Highest

          $settings = New-ScheduledTaskSettingsSet `
            -StartWhenAvailable `
            -MultipleInstances IgnoreNew `
            -ExecutionTimeLimit (New-TimeSpan -Minutes 45)

          Register-ScheduledTask `
            -TaskName $taskName `
            -Action $action `
            -Trigger $trigger `
            -Principal $principal `
            -Settings $settings `
            -User $account `
            -Password $env:RDP_PASSWORD `
            -Force | Out-Null

          Start-ScheduledTask -TaskName $taskName

          $statusPath = Join-Path $root "status.txt"

          Set-Content -Path $statusPath `
            -Value "RUNNING: App installation started automatically."

          Write-Output "::notice::App installation task registered and started automatically."
          Write-Output "::notice::Install log: $root\install.log"
          Write-Output "::endgroup::"

      # ==========================================================
      # 11. Keep the temporary session alive
      # ==========================================================
      - name: "⏳ Keep session alive"
        shell: pwsh
        run: |
          Write-Output "::group::Session keep-alive"
          $ErrorActionPreference = "Stop"

          [int]$minutes = 355

          if (-not [int]::TryParse($env:SESSION_MINUTES, [ref]$minutes)) {
              $minutes = 355
          }

          $minutes = [math]::Max(1, [math]::Min(355, $minutes))

          $endTime = (Get-Date).AddMinutes($minutes)
          $statusPath = Join-Path `
            $env:ProgramData "ATOMA-AppSetup\status.txt"

          Write-Output "::notice::Session will remain active for $minutes minutes."
          Write-Output "Monitoring ATOMA app installation status..."

          $lastStatus = $null

          while ((Get-Date) -lt $endTime) {
              if (Test-Path $statusPath) {
                  $currentStatus = Get-Content $statusPath -Raw

                  if ($currentStatus -ne $lastStatus) {
                      Write-Host "ATOMA app status: $currentStatus"
                      $lastStatus = $currentStatus
                  }
              }

              $remaining = [math]::Ceiling(
                ($endTime - (Get-Date)).TotalMinutes
              )

              Write-Host "[$(Get-Date -Format 'HH:mm:ss')] Session active; $remaining minutes remaining."

              Start-Sleep -Seconds 60
          }

          Write-Output "::notice::Session duration reached. The runner will be destroyed."
          Write-Output "::endgroup::"
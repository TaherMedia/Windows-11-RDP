name: 🪟 Windows 11 UltraVNC TEMP

on:
  workflow_dispatch:
    inputs:
      session_minutes:
        description: "How long to keep the session alive (minutes)"
        required: false
        default: "360"

jobs:
  setup-vnc:
    runs-on: windows-2025
    timeout-minutes: 350

    env:
      VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}

    steps:
      - name: 🌐 Install Tailscale VPN
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "🌐 Downloading Tailscale..."

          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.102.2-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force -ErrorAction SilentlyContinue

          Write-Host "✅ Tailscale installed"

      - name: 🔗 Connect to Tailscale Mesh
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "🔗 Authenticating & joining Tailscale network..."

          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID

          $tsIP = $null
          $retries = 0

          while (-not $tsIP -and $retries -lt 12) {
              $tsIP = (& "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4 | Select-Object -First 1).Trim()
              Start-Sleep -Seconds 5
              $retries++
          }

          if (-not $tsIP) {
              Write-Error "❌ Failed to obtain Tailscale IP"
              exit 1
          }

          "TAILSCALE_IP=$tsIP" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "📍 Tailscale IP: $tsIP"

          Write-Host "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          Write-Host "🟢 VNC WILL BE AVAILABLE SOON"
          Write-Host "🔌 VNC Port      : 5900"
          Write-Host "🔗 VNC Link      : vnc://$tsIP:5900"
          Write-Host "🧷 Import Target : $tsIP:5900"
          Write-Host "🔐 Password      : use VNC_PASSWORD secret"
          Write-Host "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: 📲 Install Telegram Desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "📲 Installing Telegram Desktop..."

          $installed = $false

          if (Get-Command winget -ErrorAction SilentlyContinue) {
              try {
                  Write-Host "📲 Trying WinGet first..."
                  winget source update | Out-Null
                  winget install --id Telegram.TelegramDesktop -e --silent --accept-package-agreements --accept-source-agreements
                  $installed = $true
                  Write-Host "✅ Telegram Desktop installed with WinGet"
              }
              catch {
                  Write-Host "⚠️ WinGet install failed, falling back to official installer."
                  Write-Host $_.Exception.Message
              }
          }
          else {
              Write-Host "⚠️ WinGet not available, using official installer fallback."
          }

          if (-not $installed) {
              $tgUrl = "https://telegram.org/dl/desktop/win64"
              $tgInstaller = "$env:TEMP\tsetup.exe"

              Invoke-WebRequest -Uri $tgUrl -OutFile $tgInstaller
              Start-Process -FilePath $tgInstaller -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait

              Start-Sleep -Seconds 5

              $installed =
                (Test-Path "$env:ProgramFiles\Telegram Desktop\Telegram.exe") -or
                (Test-Path "$env:LOCALAPPDATA\Programs\Telegram Desktop\Telegram.exe") -or
                (Get-Command Telegram -ErrorAction SilentlyContinue)

              Remove-Item $tgInstaller -Force -ErrorAction SilentlyContinue
          }

          if (-not $installed) {
              Write-Error "❌ Telegram Desktop installation failed"
              exit 1
          }

          Write-Host "✅ Telegram Desktop installed"

      - name: ☁️ Install Cloudflare WARP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "☁️ Downloading latest Cloudflare WARP..."

          $warpUrl = "https://1111-releases.cloudflareclient.com/windows/Cloudflare_WARP_Release-x64.msi"
          $warpInstaller = "$env:TEMP\warp.msi"

          Invoke-WebRequest -Uri $warpUrl -OutFile $warpInstaller
          Start-Process msiexec.exe -ArgumentList "/i", "`"$warpInstaller`"", "/quiet", "/norestart" -Wait
          Remove-Item $warpInstaller -Force -ErrorAction SilentlyContinue

          Write-Host "✅ Cloudflare WARP installed (left disconnected on purpose)"

      - name: 🖱️ Install UltraVNC
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "🖱️ Installing UltraVNC..."

          if (-not (Get-Command choco -ErrorAction SilentlyContinue)) {
              Write-Error "❌ Chocolatey is not available on this runner"
              exit 1
          }

          choco install ultravnc -y --no-progress

          $vncPath = "C:\Program Files\uvnc bvba\UltraVNC"
          if (!(Test-Path $vncPath)) { $vncPath = "C:\Program Files\UltraVNC" }

          if (!(Test-Path $vncPath)) {
              Write-Error "❌ UltraVNC install folder not found"
              exit 1
          }

          Write-Host "✅ UltraVNC installed at $vncPath"

      - name: ⚙️ Configure UltraVNC Password
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $vncPath = "C:\Program Files\uvnc bvba\UltraVNC"
          if (!(Test-Path $vncPath)) { $vncPath = "C:\Program Files\UltraVNC" }

          if (!(Test-Path $vncPath)) {
              Write-Error "❌ UltraVNC install folder not found"
              exit 1
          }

          if ([string]::IsNullOrWhiteSpace($env:VNC_PASSWORD)) {
              Write-Error "❌ VNC_PASSWORD secret is empty"
              exit 1
          }

          $vncPassword = $env:VNC_PASSWORD
          if ($vncPassword.Length -gt 8) {
              Write-Host "⚠️ UltraVNC classic auth only uses the first 8 characters. Trimming VNC_PASSWORD to 8 chars."
              $vncPassword = $vncPassword.Substring(0, 8)
          }

          $iniFile = Join-Path $vncPath "ultravnc.ini"
          $portableFlag = Join-Path $vncPath "ultravnc.portable"

          @"
[ultravnc]
passwd=
passwd2=
AuthRequired=1
MSLogonRequired=0
NewMSLogon=0
UseRegistry=0
ConnectPriority=0
DisableTrayIcon=1

[poll]
TurboMode=1
EnableDriver=0
EnableHook=1
"@ | Set-Content -Path $iniFile -Encoding ASCII

          New-Item -Path $portableFlag -ItemType File -Force | Out-Null

          $zip = Join-Path $env:TEMP "createpassword.zip"
          $extract = Join-Path $env:TEMP "createpassword"
          Remove-Item $extract -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $extract | Out-Null

          Invoke-WebRequest -Uri "https://uvnc.eu/download/133/createpassword.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $extract -Force

          $createExe = Get-ChildItem -Path $extract -Recurse -Filter "createpassword*.exe" |
                       Where-Object { $_.Name -match 'x64' } |
                       Select-Object -First 1

          if (-not $createExe) {
              $createExe = Get-ChildItem -Path $extract -Recurse -Filter "createpassword*.exe" |
                           Select-Object -First 1
          }

          if (-not $createExe) {
              Write-Error "❌ createpassword.exe not found after extraction"
              exit 1
          }

          Copy-Item $createExe.FullName -Destination (Join-Path $vncPath $createExe.Name) -Force
          $localCreate = Join-Path $vncPath $createExe.Name

          Push-Location $vncPath
          try {
              & $localCreate -secure $vncPassword
              if ($LASTEXITCODE -ne 0) {
                  Write-Error "❌ createpassword failed with exit code $LASTEXITCODE"
                  exit 1
              }
          }
          finally {
              Pop-Location
          }

          if (!(Test-Path $iniFile)) {
              Write-Error "❌ ultravnc.ini was not created"
              exit 1
          }

          Write-Host "✅ UltraVNC password configured from VNC_PASSWORD"

      - name: 🚀 Start VNC Service
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vncPath = "C:\Program Files\uvnc bvba\UltraVNC"
          if (!(Test-Path "$vncPath\winvnc.exe")) { $vncPath = "C:\Program Files\UltraVNC" }

          if (!(Test-Path "$vncPath\winvnc.exe")) {
              Write-Error "❌ winvnc.exe not found"
              exit 1
          }

          Push-Location $vncPath
          ./winvnc.exe -install
          Start-Sleep -Seconds 5

          Stop-Service -Name "uvnc_service" -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          Start-Service -Name "uvnc_service"
          Pop-Location

          Write-Host "✅ VNC Service is now running"

      - name: 🔥 Firewall
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (!(Get-NetFirewallRule -DisplayName "UltraVNC_Automated" -ErrorAction SilentlyContinue)) {
              New-NetFirewallRule -DisplayName "UltraVNC_Automated" -Direction Inbound -Action Allow -Protocol TCP -LocalPort 5900
          }

          Write-Host "✅ Firewall rule added for port 5900"

      - name: ⏳ Keep Alive & Display Connection Info
        shell: pwsh
        run: |
          $minutesInput = "${{ github.event.inputs.session_minutes }}"
          if ([string]::IsNullOrWhiteSpace($minutesInput)) { $minutesInput = "60" }
          $minutes = [int]$minutesInput

          if ($minutes -gt 335) {
              Write-Host "⚠️ session_minutes capped at 335 (job timeout-minutes is 350)"
              $minutes = 335
          }

          $endTime = (Get-Date).AddMinutes($minutes)

          Write-Host "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          Write-Host "🟢 TEMPORARY VNC SESSION IS READY"
          Write-Host "🌐 Tailscale IP  : $env:TAILSCALE_IP"
          Write-Host "🔌 VNC Port      : 5900"
          Write-Host "🔗 VNC Link      : vnc://$($env:TAILSCALE_IP):5900"
          Write-Host "🧷 Import Target : $($env:TAILSCALE_IP):5900"
          Write-Host "🔐 Password      : use VNC_PASSWORD secret"
          Write-Host "⏱️  Duration      : $minutes minutes"
          Write-Host "📲 Telegram Desktop installed"
          Write-Host "☁️ Cloudflare WARP installed (off)"
          Write-Host "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          while ((Get-Date) -lt $endTime) {
              $remaining = [math]::Ceiling((New-TimeSpan -Start (Get-Date) -End $endTime).TotalMinutes)
              Write-Host "[$(Get-Date -Format 'HH:mm:ss')] 🟢 Session alive... ($remaining min remaining)"
              Start-Sleep -Seconds 300
          }

          Write-Host "⏹️ Session duration reached — job will now end."
